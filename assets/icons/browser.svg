<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Globe gradient -->
    <radialGradient id="globe" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#00CDFF"/>
      <stop offset="40%" stop-color="#0099FF"/>
      <stop offset="100%" stop-color="#003EAA"/>
    </radialGradient>
    <!-- Fox body main gradient -->
    <linearGradient id="fox-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBD4F"/>
      <stop offset="25%" stop-color="#FF980E"/>
      <stop offset="50%" stop-color="#FF5B00"/>
      <stop offset="75%" stop-color="#FF3700"/>
      <stop offset="100%" stop-color="#E31B00"/>
    </linearGradient>
    <!-- Fox tail gradient -->
    <linearGradient id="fox-tail" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFBD4F"/>
      <stop offset="30%" stop-color="#FF980E"/>
      <stop offset="60%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <!-- Head highlight -->
    <radialGradient id="head-light" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFF44F"/>
      <stop offset="50%" stop-color="#FFBD4F"/>
      <stop offset="100%" stop-color="#FF980E"/>
    </radialGradient>
    <!-- Inner glow -->
    <radialGradient id="inner-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF980E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF3700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Globe/Earth -->
  <circle cx="256" cy="256" r="180" fill="url(#globe)"/>
  
  <!-- Globe shine -->
  <ellipse cx="200" cy="190" rx="80" ry="60" fill="white" fill-opacity="0.15"/>
  
  <!-- Fox body wrapping around globe -->
  <path d="M480 180
           C490 130 470 80 420 55
           C400 45 370 40 340 50
           C310 60 290 80 280 95
           C270 85 250 75 220 80
           C180 88 150 110 135 145
           C115 190 120 250 150 310
           C175 360 210 400 260 430
           C300 455 350 465 400 455
           C450 442 485 400 495 340
           C505 280 495 220 480 180Z" 
        fill="url(#fox-body)"/>
  
  <!-- Fox tail - sweeping around -->
  <path d="M135 145
           C100 110 60 95 30 100
           C15 102 5 115 10 135
           C20 170 55 200 100 230
           C130 250 145 270 150 310
           C120 250 100 210 90 180
           C75 140 95 130 135 145Z" 
        fill="url(#fox-tail)"/>
  
  <!-- Additional tail flame wisps -->
  <path d="M30 100
           C10 85 -5 95 5 120
           C12 140 35 160 60 175
           C40 155 25 130 30 100Z" 
        fill="#FFBD4F"/>
  
  <path d="M60 80
           C35 65 15 75 25 100
           C32 120 55 145 85 165
           C60 140 50 110 60 80Z" 
        fill="#FF980E"/>
  
  <!-- Fox head -->
  <path d="M340 50
           C370 40 400 45 420 55
           C445 68 465 90 470 120
           C475 150 465 175 445 195
           C420 220 385 230 350 225
           C320 220 295 200 285 170
           C275 140 285 100 310 70
           C320 58 330 52 340 50Z" 
        fill="url(#head-light)"/>
  
  <!-- Fox ear -->
  <path d="M380 35
           C395 15 420 10 435 25
           C445 38 440 55 430 70
           C420 60 400 55 380 60
           C375 50 375 40 380 35Z" 
        fill="#FF980E"/>
  
  <path d="M385 40
           C395 25 415 22 425 32
           C432 42 428 55 420 65
           C412 58 398 55 385 58
           C382 50 382 44 385 40Z" 
        fill="#FFBD4F"/>
  
  <!-- Fox snout/nose area -->
  <path d="M450 140
           C470 125 485 130 490 145
           C495 165 480 185 455 195
           C445 180 448 155 450 140Z" 
        fill="#FF5B00"/>
  
  <!-- Nose -->
  <ellipse cx="485" cy="155" rx="8" ry="6" fill="#2D1F00"/>
  
  <!-- Eye -->
  <ellipse cx="420" cy="115" rx="12" ry="14" fill="#2D1F00"/>
  <ellipse cx="422" cy="112" rx="4" ry="5" fill="white" fill-opacity="0.6"/>
  
  <!-- Body detail curves -->
  <path d="M280 95
           C295 110 305 140 300 175
           C295 205 280 235 260 260
           C250 230 255 195 270 165
           C280 140 280 115 280 95Z" 
        fill="#FF3700" fill-opacity="0.5"/>
  
  <path d="M260 430
           C290 440 330 445 370 435
           C340 450 300 455 260 445
           C240 440 225 430 215 415
           C230 425 245 430 260 430Z" 
        fill="#E31B00"/>
  
  <!-- Inner glow on globe -->
  <circle cx="256" cy="256" r="180" fill="url(#inner-glow)"/>
</svg>
